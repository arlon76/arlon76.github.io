<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SK82D TEST</title>

<style>

html,
body{

    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#app{

    width:100vw;
    height:100vh;
}

</style>

</head>
<body>

<div id="app"></div>

<script type="module">

/* =========================================================
   LOAD HTML EXTRAPOLATOR
========================================================= */

const htmlApi =
    await import('../web-application-plug-ins/html-extrapolator-001.js');

window.tag =
    htmlApi.tag;

window.toHtmlString =
    htmlApi.toHtmlString;

/* =========================================================
   LOAD GAME MODULE
========================================================= */

const sk82dMod =
    await import('./sk82d-004.js');

const { Sk82D } =
    sk82dMod;

/* =========================================================
   CREATE GAME
========================================================= */

const game =
    new Sk82D({

        mount:'#app',

        width:900,
        height:700,

        challengeJoinSeconds:5,
        gameSeconds:9999,

        theme:'classic',

        onReady:(g)=>{

            console.log(
                'READY',
                g
            );
        },

        onScore:(e)=>{

            console.log(
                'SCORE',
                e
            );
        },

        onGameEnd:(e)=>{

            console.log(
                'GAME END',
                e
            );
        }
    });

window.game =
    game;

game.start();

</script>

</body>
</html>
